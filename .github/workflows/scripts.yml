name: Scripts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check string catalogs
        run: python3 scripts/l10n-check.py
      - name: Test geocoder tooling
        run: python3 scripts/test-geocoder-tooling.py
